<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>ARCHIVE — 흙의 기록</title>
</head>
<body data-page="archive">
<main id="root"></main>
<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const i = Math.max(0, JOURNAL.findIndex(j => j.id === qs('id')));
const j = JOURNAL[i], prev = JOURNAL[i + 1], next = JOURNAL[i - 1];
document.title = `${j.title} — ${SITE.name}`;
document.getElementById('root').innerHTML = `
  <p class="crumb"><a href="index.html">HOME</a> / <a href="archive.html">ARCHIVE</a></p>
  <article class="article" style="padding-top:60px">
    <p class="meta">No. ${j.id}</p>
    <h1>${j.title}</h1>
    <p class="date">${j.date}</p>
    ${j.body.map(([t, a, b]) => t === 'p' ? `<p class="t reveal">${a}</p>` : `<figure class="reveal"><div><img src="${L(a)}" alt="${b}" loading="lazy" style="height:auto"></div>${b ? `<figcaption>${b}</figcaption>` : ''}</figure>`).join('')}
  </article>
  <nav class="article-nav">
    ${prev ? `<a href="journal.html?id=${prev.id}"><span>PREV</span>${prev.title}</a>` : '<i></i>'}
    ${next ? `<a href="journal.html?id=${next.id}" style="text-align:right"><span>NEXT</span>${next.title}</a>` : '<i></i>'}
  </nav>
  <a class="more" href="archive.html">LIST</a>`;
</script>
</body>
</html>
