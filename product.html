<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>상품 — 흙의 기록</title>
</head>
<body data-page="shop">
<main id="pd-root"></main>
<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const p = findP(qs('id')) || PRODUCTS[0];
document.title = `${p.name} — ${SITE.name}`;
const sold = p.tag === 'SOLD OUT';
// 흰 배경 사진 먼저, 그다음 실제 촬영 사진
const gallery = [...p.cut.map(i => [CS(i), C(i)]), ...p.imgs.map(i => [S(i), L(i)])];
document.getElementById('pd-root').innerHTML = `
  <p class="crumb"><a href="index.html">HOME</a> / <a href="shop.html">SHOP</a> / <a href="shop.html?c=${p.cat}">${CATS[p.cat]}</a></p>
  <div class="pd">
    <div class="pd-gallery">
      <div class="pd-thumbs">${gallery.map(([s, l], k) => `<button${k ? '' : ' class="on"'} data-l="${l}" aria-label="사진 ${k + 1}"><img src="${s}" alt=""></button>`).join('')}</div>
      <div class="pd-main">${p.tag ? `<span class="tag${sold ? ' sold' : ''}">${p.tag}</span>` : ''}<img id="mainImg" src="${gallery[0][1]}" alt="${p.name}"></div>
    </div>
    <div class="pd-info">
      <p class="cat">${CATS[p.cat]}</p>
      <h1>${p.name}</h1>
      <p class="en-name">${p.en}</p>
      <p class="price">${sold ? `<s style="color:var(--muted)">${won(p.price)}</s> 품절` : won(p.price)}</p>
      <p class="lead">${p.lead}</p>
      <dl class="spec">
        <div><dt>크기</dt><dd>${p.size}</dd></div>
        <div><dt>흙</dt><dd>${p.clay}</dd></div>
        <div><dt>유약</dt><dd>${p.glaze}</dd></div>
        <div><dt>배송</dt><dd>${won(SITE.shipFee)} · ${won(SITE.freeShip)} 이상 무료 · 2–3일 안에 발송</dd></div>
      </dl>
      ${p.options ? `<div class="opt"><label for="opt">색상</label><select id="opt"><option value="">— 색상을 고르세요 —</option>${p.options.map(o => `<option>${o}</option>`).join('')}</select></div>` : ''}
      <div class="qty-row">
        <div class="qty"><button id="minus" aria-label="빼기">−</button><span id="q">1</span><button id="plus" aria-label="더하기">+</button></div>
        <p class="total">총 금액<b id="total">${won(p.price)}</b></p>
      </div>
      <div class="btns">
        <button class="btn" id="addCart"${sold ? ' disabled' : ''}>장바구니</button>
        <button class="btn dark" id="buyNow"${sold ? ' disabled' : ''}>${sold ? '품절' : '바로 구매'}</button>
      </div>
      <div class="acc">
        <details><summary>사용 · 관리</summary><p>유약을 입힌 그릇은 식기세척기·전자레인지에 쓸 수 있습니다. 오븐과 직화는 피해 주세요. 무유(테라코타) 부분은 물이 스밀 수 있어 손세척 후 잘 말려 주세요.</p></details>
        <details><summary>수작업 안내</summary><p>손으로 빚고 장작 대신 전기 가마에서 구워, 사진과 색·크기·철점의 위치가 조금씩 다릅니다. 이는 불량이 아니며 그릇마다 지닌 고유한 표정입니다.</p></details>
        <details><summary>배송 · 교환 · 반품</summary><p>주문 후 2–3일 안에 한 점씩 종이로 감싸 보냅니다. 받은 날부터 7일 안에 교환·반품을 신청할 수 있으며, 단순 변심은 왕복 배송비를 부담합니다.</p></details>
      </div>
    </div>
  </div>

  <div class="pd-story">
    <h2 class="reveal">${p.story[0]}</h2>
    <p class="body reveal">${p.story[1]}</p>
    <div class="pics">${p.imgs.slice(0, 2).map(i => `<div class="reveal"><img src="${L(i)}" alt="" loading="lazy"></div>`).join('')}</div>
  </div>

  <section>
    <div class="sec-hd reveal"><h2>YOU MAY ALSO LIKE</h2></div>
    <div class="grid">${PRODUCTS.filter(x => x.cat === p.cat && x.id !== p.id).concat(PRODUCTS.filter(x => x.cat !== p.cat)).slice(0, 4).map(card).join('')}</div>
  </section>`;

let q = 1;
const setQ = n => { q = Math.max(1, Math.min(10, n)); document.getElementById('q').textContent = q; document.getElementById('total').textContent = won(p.price * q); };
document.getElementById('minus').onclick = () => setQ(q - 1);
document.getElementById('plus').onclick = () => setQ(q + 1);
document.querySelectorAll('.pd-thumbs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.pd-thumbs button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('mainImg').src = b.dataset.l;
});
const optOk = () => {
  const o = document.getElementById('opt');
  if (o && !o.value) { notice('색상을 골라 주세요', '원통 컵은 네 가지 흙빛 중 하나를 고를 수 있습니다.'); return null; }
  return o ? o.value : '';
};
document.getElementById('addCart').onclick = () => { const o = optOk(); if (o === null) return; Cart.add(p.id, o, q); toast(thumb(p),p.name + (o ? ` · ${o}` : '')); };
document.getElementById('buyNow').onclick = () => { const o = optOk(); if (o === null) return; Cart.add(p.id, o, q); location.href = 'cart.html'; };
</script>
</body>
</html>
