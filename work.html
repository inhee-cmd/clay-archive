<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>작품 — 흙의 기록</title>
</head>
<body data-page="works">
<main id="root"></main>
<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const i = Math.max(0, WORKS.findIndex(w => w.id === qs('id')));
const w = WORKS[i], prev = WORKS[(i - 1 + WORKS.length) % WORKS.length], next = WORKS[(i + 1) % WORKS.length];
document.title = `${w.name} — ${SITE.name}`;
// 흰 배경 사진 먼저, 그다음 실제 촬영 사진
const gallery = [...w.cut.map(i => [CS(i), C(i)]), ...w.imgs.map(i => [S(i), L(i)])];
document.getElementById('root').innerHTML = `
  <p class="crumb"><a href="index.html">HOME</a> / <a href="works.html">WORKS</a> / <a href="works.html?c=${w.cat}">${CATS[w.cat]}</a></p>
  <div class="pd">
    <div class="pd-gallery">
      <div class="pd-thumbs">${gallery.map(([s, l], k) => `<button${k ? '' : ' class="on"'} data-l="${l}" aria-label="사진 ${k + 1}"><img src="${s}" alt=""></button>`).join('')}</div>
      <div class="pd-main">${w.tag ? `<span class="tag">${w.tag}</span>` : ''}<img id="mainImg" src="${gallery[0][1]}" alt="${w.name}"></div>
    </div>
    <div class="pd-info">
      <p class="cat">${CATS[w.cat]} · ${w.year}</p>
      <h1>${w.name}</h1>
      <p class="en-name">${w.en}</p>
      <p class="lead">${w.lead}</p>
      <dl class="spec">
        <div><dt>크기</dt><dd>${w.size}</dd></div>
        <div><dt>흙</dt><dd>${w.clay}</dd></div>
        <div><dt>유약</dt><dd>${w.glaze}</dd></div>
        <div><dt>제작</dt><dd>물레 성형 · 굽 깎기 · 초벌 800℃ · 재벌 1,250℃</dd></div>
      </dl>
      <a class="btn" style="margin-top:28px" href="https://instagram.com/${SITE.insta}" target="_blank" rel="noopener">작품 문의 · Instagram DM</a>
      <nav class="work-nav">
        <a href="work.html?id=${prev.id}"><span>PREV</span>${prev.name}</a>
        <a href="work.html?id=${next.id}" style="text-align:right"><span>NEXT</span>${next.name}</a>
      </nav>
    </div>
  </div>

  <div class="pd-story">
    <h2 class="reveal">${w.story[0]}</h2>
    <p class="body reveal">${w.story[1]}</p>
    <div class="pics">${w.imgs.slice(0, 2).map(i => `<div class="reveal"><img src="${L(i)}" alt="" loading="lazy"></div>`).join('')}</div>
  </div>

  <section>
    <div class="sec-hd reveal"><h2>MORE WORKS</h2></div>
    <div class="grid">${WORKS.filter(x => x.cat === w.cat && x.id !== w.id).concat(WORKS.filter(x => x.cat !== w.cat)).slice(0, 4).map(card).join('')}</div>
    <a class="more" href="works.html">ALL WORKS</a>
  </section>`;

document.querySelectorAll('.pd-thumbs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.pd-thumbs button').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('mainImg').src = b.dataset.l;
});
</script>
</body>
</html>
