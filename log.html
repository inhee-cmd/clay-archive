<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>LOG — 흙의 기록</title>
</head>
<body data-page="log">
<main>
  <div class="page-hd"><h1>LOG</h1><p id="sub"></p></div>
  <div class="log-bar">
    <div class="seg" id="order"><button data-v="new" class="on">최신순</button><button data-v="old">처음부터</button></div>
    <div class="seg" id="view"><button data-v="list" class="on">일지</button><button data-v="grid">모아보기</button></div>
  </div>
  <div id="list"></div>
</main>
<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
document.getElementById('sub').textContent = `${dot(LOG[0].d)} — ${dot(NEWEST[0].d)} · ${LOG.length}편의 작업일지`;
const state = { order: 'new', view: 'list' };
try { Object.assign(state, JSON.parse(localStorage.getItem('clay-log') || '{}')); } catch {}

function draw() {
  const rows = state.order === 'new' ? NEWEST : LOG;
  const root = document.getElementById('list');
  if (state.view === 'grid') {
    root.className = 'log-grid';
    root.innerHTML = rows.map(e => `<a class="reveal" href="entry.html?id=${e.id}" style="flex:${e.r} 1 ${Math.round(e.r * 220)}px;aspect-ratio:${e.r}"><img src="${S(e.id)}" alt="${e.t}" loading="lazy"><span>${dot(e.d)}<b>${e.t}</b></span></a>`).join('');
  } else {
    // 달마다 묶어 보여 준다
    root.className = 'log-list';
    let html = '', month = '';
    rows.forEach(e => {
      const m = e.d.slice(0, 7);
      if (m !== month) { month = m; html += `<h2 class="month reveal">${m.replace('-', '.')}</h2>`; }
      html += `<article class="entry reveal${e.r < 1 ? ' tall' : ''}">
        <a class="ph" href="entry.html?id=${e.id}"><img src="${L(e.id)}" alt="${e.t}" loading="lazy"></a>
        <div class="txt"><p class="date">${dot(e.d)}</p><h3><a href="entry.html?id=${e.id}">${e.t}</a></h3><p class="note">${e.n}</p></div>
      </article>`;
    });
    root.innerHTML = html;
  }
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', state[b.parentElement.id] === b.dataset.v));
  try { localStorage.setItem('clay-log', JSON.stringify(state)); } catch {}
  reveal();
}
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { state[b.parentElement.id] = b.dataset.v; draw(); });
draw();
</script>
</body>
</html>
