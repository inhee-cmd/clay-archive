<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>흙의 기록 — 물레 앞에서 보낸 날들</title>
<meta name="description" content="물레로 빚고 두 번 구운 그릇, 1년의 작업일지">
</head>
<body data-page="home">
<main>
  <div class="hero" id="hero">
    <figure class="on"><img src="img/l/0665.jpg" alt="" style="object-position:50% 60%"></figure>
    <figure><img src="img/l/7756.jpg" alt=""></figure>
    <figure><img src="img/l/0159.jpg" alt="" style="object-position:50% 40%"></figure>
    <div class="cap">
      <p id="heroSub"></p>
      <h1 id="heroTxt"></h1>
      <a id="heroLink" href="log.html">READ</a>
    </div>
    <div class="dots" id="dots"><button aria-label="1"></button><button aria-label="2"></button><button aria-label="3"></button></div>
  </div>

  <section>
    <div class="sec-hd reveal"><h2>RECENT</h2><p>최근의 작업일지</p></div>
    <div class="grid" id="recent"></div>
    <a class="more" href="log.html">ALL LOGS</a>
  </section>

  <section class="band reveal">
    <div class="ph"><img src="img/l/1725.jpg" alt="작업대 위의 접시" loading="lazy"></div>
    <div class="txt">
      <p class="en">ABOUT</p>
      <h2>흙을 고르고, 물레를 차고,<br>굽을 깎아 두 번 굽습니다</h2>
      <p class="body" id="aboutTxt"></p>
      <a class="link" href="about.html">MORE</a>
    </div>
  </section>

  <section>
    <div class="sec-hd reveal"><h2>FROM THE BEGINNING</h2><p>처음 남긴 기록들</p></div>
    <div class="grid" id="first"></div>
  </section>
</main>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
document.getElementById('recent').innerHTML = NEWEST.slice(0, 8).map(card).join('');
document.getElementById('first').innerHTML = LOG.slice(0, 4).map(card).join('');
document.getElementById('aboutTxt').textContent = `${dot(LOG[0].d)}부터 물레 앞에서 보낸 날들을 사진 한 장과 짧은 글로 남겼습니다. 지금까지 ${LOG.length}편. 같은 이름의 그릇이라도 조금씩 다른 것은, 손이 기억하는 만큼만 만들기 때문입니다.`;

const slides = [
  ['0665', '손끝에서 시작해<br>식탁에서 완성되는 그릇'],
  ['7756', '푸른 기가 살짝 도는<br>청백 찻잔'],
  ['0159', '빛을 머금는<br>무광 백자'],
].map(([id, h]) => { const e = LOG.find(x => x.id === id); return [`${dot(e.d)} · ${e.t}`, h, id]; });
const figs = document.querySelectorAll('#hero figure'), dots = document.querySelectorAll('#dots button');
let cur = 0, timer;
const go = i => {
  cur = i;
  figs.forEach((f, k) => f.classList.toggle('on', k === i));
  dots.forEach((d, k) => d.classList.toggle('on', k === i));
  heroSub.textContent = slides[i][0]; heroTxt.innerHTML = slides[i][1]; heroLink.href = 'entry.html?id=' + slides[i][2];
};
const run = () => { clearInterval(timer); timer = setInterval(() => go((cur + 1) % figs.length), 5500); };
dots.forEach((d, k) => d.onclick = () => { go(k); run(); });
go(0); run();
</script>
</body>
</html>
