<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&family=Noto+Sans+KR:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<title>흙의 기록 — 손으로 빚은 그릇</title>
<meta name="description" content="물레로 빚어 두 번 구운 그릇과 작업실의 기록, 흙의 기록">
</head>
<body data-page="home">
<main>
  <div class="hero" id="hero">
    <figure class="on"><img src="img/l/0666.jpg" alt="테라코타 밥공기 세 점" style="object-position:50% 60%"></figure>
    <figure><img src="img/l/7756.jpg" alt="청백 찻잔"></figure>
    <figure><img src="img/l/0159.jpg" alt="백자 화병" style="object-position:50% 40%"></figure>
    <div class="cap">
      <p id="heroSub"></p>
      <h1 id="heroTxt"></h1>
      <a id="heroLink" href="works.html">VIEW WORK</a>
    </div>
    <div class="dots" id="dots"><button aria-label="1"></button><button aria-label="2"></button><button aria-label="3"></button></div>
  </div>

  <section>
    <div class="sec-hd reveal"><h2>NEW WORKS</h2><p>이번 가마에서 막 나온 그릇</p></div>
    <div class="grid" id="newGrid"></div>
    <a class="more" href="works.html">ALL WORKS</a>
  </section>

  <section class="band reveal">
    <div class="ph"><img src="img/l/1725.jpg" alt="작업실 선반" loading="lazy"></div>
    <div class="txt">
      <p class="en">ABOUT</p>
      <h2>흙을 고르고, 물레를 차고,<br>굽을 깎아 두 번 굽습니다</h2>
      <p class="body">한 점의 그릇이 나오기까지 꼬박 3주가 걸립니다. 서두르지 않고, 손이 기억하는 만큼만 만듭니다. 같은 이름의 그릇이라도 조금씩 다른 것은 그 때문입니다.</p>
      <a class="link" href="about.html">MORE</a>
    </div>
  </section>

  <section>
    <div class="sec-hd reveal"><h2>SELECTED</h2><p>오래 곁에 두고 싶은 작품</p></div>
    <div class="grid" id="selGrid"></div>
  </section>

  <section>
    <div class="sec-hd reveal"><h2>ARCHIVE</h2><p>작업실에서 남긴 기록</p></div>
    <div class="journal row" id="jGrid"></div>
    <a class="more" href="archive.html">ALL STORIES</a>
  </section>

  <section>
    <div class="sec-hd reveal"><h2>@ARCHIVE.OF.CLAY</h2></div>
    <div class="insta" id="insta"></div>
  </section>
</main>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const byId = ids => ids.map(findW);
document.getElementById('newGrid').innerHTML = WORKS.filter(w => w.tag === 'NEW').concat(byId(['cylinder-cup', 'pedestal-bowl'])).map(card).join('');
document.getElementById('selGrid').innerHTML = byId(['white-vase', 'rim-plate-set', 'gray-soup-bowl', 'terracotta-pot']).map(card).join('');
document.getElementById('jGrid').innerHTML = JOURNAL.slice(0, 3).map(j => `<a class="reveal" href="journal.html?id=${j.id}"><div class="ph"><img src="${S(j.cover)}" alt="" loading="lazy"></div><p class="no">No. ${j.id}</p><h3>${j.title}</h3><p>${j.excerpt}</p></a>`).join('');
document.getElementById('insta').innerHTML = ['0543', '2101', '8276', '4764', '5319', '6218'].map(i => `<a href="https://instagram.com/${SITE.insta}" target="_blank" rel="noopener"><img src="${S(i)}" alt="" loading="lazy"></a>`).join('');

// 표지 슬라이드
const slides = [
  ['NEW WORK · WINTER 2026', '손끝에서 시작해<br>식탁에서 완성되는 그릇', 'terracotta-rice-bowl'],
  ['NEW WORK · PALE CELADON', '겨울 신작,<br>청백 찻잔', 'celadon-teacup'],
  ['SELECTED · VASE', '빈 자리에 놓아도<br>충분한 화병', 'white-vase'],
];
const figs = document.querySelectorAll('#hero figure'), dots = document.querySelectorAll('#dots button');
let cur = 0, timer;
const go = i => {
  cur = i;
  figs.forEach((f, k) => f.classList.toggle('on', k === i));
  dots.forEach((d, k) => d.classList.toggle('on', k === i));
  heroSub.textContent = slides[i][0]; heroTxt.innerHTML = slides[i][1]; heroLink.href = 'work.html?id=' + slides[i][2];
};
const run = () => { clearInterval(timer); timer = setInterval(() => go((cur + 1) % figs.length), 5500); };
dots.forEach((d, k) => d.onclick = () => { go(k); run(); });
go(0); run();
</script>
</body>
</html>
